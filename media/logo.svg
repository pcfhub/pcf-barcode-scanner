<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A barcode on the field it scans into.

       The card is the text column; the bars are what the button puts in it.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. The first attempt was a viewfinder instead: four corner
       brackets with a scan line across them, which is the camera half of the
       control rather than the field half. It also put eight stroke ends and a
       bar inside an interior thirteen pixels tall, and at 24 the corners closed
       up into a ring.

       The bars are deliberately uneven in width, 8 5 9 5 8, because five even
       bars read as a grille. They are tall rather than wide so that the pattern
       survives when each one is under two pixels across.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="barcode-scanner-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The field. -->
  <rect x="6" y="10" width="84" height="76" rx="18" fill="url(#barcode-scanner-ramp)"/>

  <!-- The code. Uneven widths on purpose. -->
  <rect x="21" y="26" width="8" height="44" rx="4" fill="#F8FAFC"/>
  <rect x="35" y="26" width="5" height="44" rx="2.5" fill="#F8FAFC"/>
  <rect x="46" y="26" width="9" height="44" rx="4.5" fill="#F8FAFC"/>
  <rect x="61" y="26" width="5" height="44" rx="2.5" fill="#F8FAFC"/>
  <rect x="72" y="26" width="8" height="44" rx="4" fill="#F8FAFC"/>
</svg>
